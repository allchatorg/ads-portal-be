spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
    protocol: smtp
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      password: ${SPRING_DATA_REDIS_PASSWORD}
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB
  quartz:
    job-store-type: jdbc
    properties:
      org:
        quartz:
          jobStore:
            driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
    jdbc:
      initialize-schema: always
  session:
    store-type: redis
    redis:
      flush-mode: on_save
      namespace: spring:session
    timeout: 1800s

server:
  address: 0.0.0.0
  port: 8081
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: JSESSIONID
        http-only: true
        secure: true
        same-site: none
        path: /
        max-age: 1800s

app:
  FRONT_END:
    URL: ${APP_FRONTEND_URL}

cloudflare:
  r2:
    access-key: ${CLOUDFLARE_ACCESS_KEY}
    secret-key: ${CLOUDFLARE_SECRET_KEY}
    bucket-name: ${CLOUDFLARE_BUCKET_NAME}
    endpoint: ${CLOUDFLARE_ENDPOINT}
    public-url: ${CLOUDFLARE_PUBLIC_URL}

stripe:
  api-key: ${STRIPE_API_KEY}

twilio:
  messaging-service-sid: ${TWILIO_MESSAGING_SERVICE_SID:}
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_TOKEN:}
  phone-number: ${TWILIO_PHONE_NUMBER:}

logging:
  level:
    org:
      springframework:
        security: WARN
